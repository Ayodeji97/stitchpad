#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# AGP 9: composeApp is a KMP *application* module applying both the
# kotlin.multiplatform and com.android.application plugins. Since AGP 9.0 the
# built-in Kotlin + new DSL are incompatible with KGP's multiplatform plugin,
# and the recommended com.android.kotlin.multiplatform.library plugin is
# library-only. Opt out of both so KGP keeps providing Kotlin for the app module.
android.builtInKotlin=false
android.newDsl=false